<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Đăng Ký Ngày Hội Việc Làm</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white max-w-md w-full rounded-2xl shadow-xl p-8 border border-slate-100">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Cổng Đăng Ký Ngày Hội Việc Làm</h1>
      <p class="text-sm text-slate-500 mt-1">CSE3051 - Đại học Quốc gia Hà Nội</p>
    </div>

    <form id="regForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Mã sinh viên</label>
        <input type="text" id="ma_sv" required placeholder="Ví dụ: 23110151"
          class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none border-slate-300">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Chọn phiên tham gia</label>
        <select id="ma_phien" required
          class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none border-slate-300 bg-white">
          <option value="P01">Phiên sáng: AI & Kỹ thuật phần mềm (P01)</option>
          <option value="P02">Phiên chiều: An toàn thông tin & Mạng (P02)</option>
        </select>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition-colors shadow">
        Đăng ký tham gia
      </button>
    </form>

    <!-- Khu vực hiển thị 3 trạng thái -->
    <div id="statusBox" class="mt-6 hidden p-4 rounded-xl text-sm font-medium"></div>
  </div>

  <script>
    const form = document.getElementById('regForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const ma_sv = document.getElementById('ma_sv').value.trim();
      const ma_phien = document.getElementById('ma_phien').value;

      // Trạng thái 1: ĐANG GỬI (Loading)
      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang xử lý...';
      statusBox.className = 'mt-6 p-4 rounded-xl text-sm font-medium bg-blue-50 text-blue-800 border border-blue-200 block';
      statusBox.innerHTML = '⏳ Hệ thống đang kiểm tra và ghi nhận thông tin đăng ký...';

      try {
        const res = await fetch('http://localhost:8000/api/dang-ky', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ma_sv, ma_phien })
        });

        if (res.status === 201) {
          // Trạng thái 2: THÀNH CÔNG (201)
          statusBox.className = 'mt-6 p-4 rounded-xl text-sm font-medium bg-green-50 text-green-800 border border-green-200 block';
          statusBox.innerHTML = '✅ Đăng ký thành công! Chúc bạn có trải nghiệm tốt tại Ngày hội việc làm.';
        } else if (res.status === 409) {
          // Trạng thái 3: BỊ TRÙNG / LỖI (409)
          statusBox.className = 'mt-6 p-4 rounded-xl text-sm font-medium bg-red-50 text-red-800 border border-red-200 block';
          statusBox.innerHTML = '❌ Lỗi (409 Conflict): Bạn đã đăng ký phiên này rồi, không thể đăng ký lại!';
        } else {
          statusBox.className = 'mt-6 p-4 rounded-xl text-sm font-medium bg-yellow-50 text-yellow-800 border border-yellow-200 block';
          statusBox.innerHTML = `⚠️ Phản hồi khác từ máy chủ: Mã lỗi ${res.status}`;
        }
      } catch (err) {
        statusBox.className = 'mt-6 p-4 rounded-xl text-sm font-medium bg-red-50 text-red-800 border border-red-200 block';
        statusBox.innerHTML = '❌ Lỗi kết nối: Không thể gọi đến API máy chủ (kiểm tra lại uvicorn & CORS).';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Đăng ký tham gia';
      }
    });
  </script>
</body>
</html>
